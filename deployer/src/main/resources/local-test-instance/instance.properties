# 解析过滤规则
# table regex：配置的是需要解析的表，可以按照整库的监听，也可以按照具体的某几张表监听，也可以按照某几张表的某几个字段
# 整库监听方式：saas_support\\..*
# 部分表监听方式：basic_data_test\\.pc_common_org,basic_data_test\\.uc_student_info
# 部分表部分字段监听：saas_support.uc_account:account_name/is_enable/account_source
canal.instance.filter.regex=.*\\..*
# table black regex：配置的是不需要过滤的表
canal.instance.filter.black.regex=mysql\\.slave_.*
# table field filter(format: schema1.tableName1:field1/field2,schema2.tableName2:field1/field2)
#canal.instance.filter.field=test1.t_product:id/subject/keywords,test2.t_company:id/name/contact/ch
# table field black filter(format: schema1.tableName1:field1/field2,schema2.tableName2:field1/field2)
#canal.instance.filter.black.field=test1.t_product:subject/product_image,test2.t_company:id/name/contact/ch

# mq config 当前实例解析后的数据发送的mq配置
# 主题名称
canal.mq.topic=example
# dynamic topic route by schema or table regex
#canal.mq.dynamicTopic=mytest1.user,topic2:mytest2\\..*,.*\\..*
# 分区默认0，数据同步默认就是1个分区
canal.mq.partition=0
# hash partition config  hash方式将数据动态写入不同的分区，hash时按照【canal.mq.partitionHash】配置的字段值进行，可配置多个
#canal.mq.enableDynamicQueuePartition=false
#canal.mq.partitionsNum=3
#canal.mq.dynamicTopicPartitionNum=test.*:4,mycanal:6
#canal.mq.partitionHash=test.table:id^name,.*\\..*
