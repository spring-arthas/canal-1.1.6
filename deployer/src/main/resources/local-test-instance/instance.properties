## mysql serverId , v1.0.26+ will autoGen
# canal.instance.mysql.slaveId=0
# enable gtid use true/false
# 是否开启按照gtid模式方式解析binlog，否则按照binlog文件名+位点+时间戳
canal.instance.gtidon=false

# position info 主库binlog配置，如果启动后都是最新消费只需配置【master.address】，如若指定文件和具体位置则需要配置master启动信息
# 注意：只要是【canal.instance.master.address】连接的所有mysql库都可以监听，但是必须都开启binlog
canal.instance.master.address=localhost:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=
#canal.instance.master.journal.name= 配置从哪个binlog文件进行读取（mysql-bin.000007.sql）
#canal.instance.master.position= 配置所要开始dump的位点值
#canal.instance.master.timestamp= binlog时间戳，long数据
#canal.instance.master.gtid=server_id:transaction_id
# rds oss binlog
canal.instance.rds.accesskey=
canal.instance.rds.secretkey=
canal.instance.rds.instanceId=
# table meta tsdb info
canal.instance.tsdb.enable=true
